<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PeerJS Room Joiner</title>
  <script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 20px; }
    .btn { padding: 12px 20px; font-size: 16px; border-radius: 8px; border: none; background: #007aff; color: white; cursor: pointer; touch-action: manipulation; }
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
    .modal.active { display: flex; }
    .modal-content { background: white; padding: 24px; border-radius: 12px; width: 85%; max-width: 320px; text-align: center; }
    input { width: 100%; padding: 10px; font-size: 16px; margin: 12px 0; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
  </style>
</head>
<body>

  <button id="joinBtn" class="btn" type="button">Join Room</button>

  <!-- Mobile-friendly modal replacing window.prompt() -->
  <div id="roomModal" class="modal">
    <div class="modal-content">
      <h3>Enter Room Code</h3>
      <input type="text" id="roomCodeInput" placeholder="e.g. 1234" autocomplete="off" autocorrect="off" autocapitalize="off" />
      <button id="submitRoomBtn" class="btn" type="button">Connect</button>
    </div>
  </div>

  <script>
    const peer = new Peer();

    const joinBtn = document.getElementById('joinBtn');
    const roomModal = document.getElementById('roomModal');
    const roomCodeInput = document.getElementById('roomCodeInput');
    const submitRoomBtn = document.getElementById('submitRoomBtn');

    // Open Modal (Works seamlessly on iOS/Android touch)
    joinBtn.addEventListener('click', (e) => {
      e.preventDefault();
      roomModal.classList.add('active');
      roomCodeInput.focus();
    });

    // Handle Joining Room
    submitRoomBtn.addEventListener('click', (e) => {
      e.preventDefault();
      const code = roomCodeInput.value.trim();
      if (!code) return;

      roomModal.classList.remove('active');
      connectToRoom(code);
    });

    function connectToRoom(remotePeerId) {
      const conn = peer.connect(remotePeerId);
      conn.on('open', () => {
        alert('Successfully joined room: ' + remotePeerId);
        conn.send('Hello from mobile!');
      });
      conn.on('error', (err) => {
        alert('Connection error: ' + err.message);
      });
    }
  </script>
</body>
</html>
